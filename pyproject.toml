[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ine-mcp"
version = "0.1.0"
description = "MCP server for the Spanish National Statistics Institute (INE) JSON API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.scripts]
ine-mcp = "ine_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ine_mcp"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
